<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkEase 2.0 | Customer Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            background: linear-gradient(135deg, #090d1c, #17112d, #24143d);
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 38px;
            border: 1px solid rgba(190, 130, 255, 0.25);
            border-radius: 20px;
            background: rgba(20, 25, 43, 0.96);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
        }

        .login-card h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
        }

        .login-subtitle {
            color: #b9b3ca;
            text-align: center;
            margin-bottom: 30px;
        }

        .login-card label {
            display: block;
            color: #e8dfff;
            margin: 18px 0 8px;
        }

        .login-card input {
            width: 100%;
            padding: 13px;
            border: 1px solid #494064;
            border-radius: 9px;
            background: #111827;
            color: white;
            outline: none;
            box-sizing: border-box;
        }

        .login-card input:focus {
            border-color: #c084fc;
        }

        .login-button {
            width: 100%;
            margin-top: 28px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(90deg, #9333ea, #ec4899);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            opacity: 0.9;
        }

        .login-footer {
            text-align: center;
            color: #b9b3ca;
            margin-top: 24px;
        }

        .login-footer a {
            color: #e879f9;
            text-decoration: none;
        }

        .login-message {
            color: #fca5a5;
            text-align: center;
            margin-bottom: 12px;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #c4b5fd;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="login-page">
        <div class="login-card">

            <h1>ParkEase <span style="color:#e879f9;">2.0</span></h1>

            <p class="login-subtitle">
                Welcome back! Sign in to your account.
            </p>

            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <p class="login-message">{{ message }}</p>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >

                <button type="submit" class="login-button">
                    Login to ParkEase
                </button>

            </form>

            <p class="login-footer">
                Don't have an account?
                <a href="{{ url_for('register') }}">Create Account</a>
            </p>

            <a href="{{ url_for('home') }}" class="home-link">
                ← Back to Home
            </a>

        </div>
    </div>
</body>
</html>
