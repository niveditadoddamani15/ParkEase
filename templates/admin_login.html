<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkEase | Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 38px;
            background: linear-gradient(145deg, #17243a, #101827);
            border: 1px solid #30415d;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        .login-card h1 {
            font-size: 27px;
            margin-bottom: 9px;
        }

        .login-card .subtitle {
            color: #8998b2;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .login-card label {
            display: block;
            margin: 18px 0 8px;
            color: #b9c8df;
            font-size: 12px;
        }

        .login-card input {
            width: 100%;
            padding: 13px;
            background: #0c1524;
            border: 1px solid #30415d;
            border-radius: 8px;
            color: white;
            outline: none;
        }

        .login-card input:focus {
            border-color: #70aaff;
        }

        .login-card button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: linear-gradient(110deg, #367cf0, #5b9cff);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-card button:hover {
            opacity: .9;
        }

        .login-brand {
            color: #70aaff;
            font-size: 23px;
            font-weight: 800;
            margin-bottom: 30px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">

        <div class="login-brand">ParkEase.</div>

        <h1>Admin Portal</h1>
        <p class="subtitle">Sign in to manage your parking operations.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash-message {{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label>Admin Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">Sign In to Dashboard</button>

        </form>

        <a href="{{ url_for('home') }}" class="back-link">
            ← Back to Customer Home
        </a>

    </div>
</div>

</body>
</html>
