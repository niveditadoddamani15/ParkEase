<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkEase 2.0 | Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .register-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 16px;
            background: linear-gradient(135deg, #090d1c, #17112d, #24143d);
        }

        .register-card {
            width: 100%;
            max-width: 460px;
            padding: 38px;
            border: 1px solid rgba(190, 130, 255, 0.25);
            border-radius: 20px;
            background: rgba(20, 25, 43, 0.96);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
        }

        .register-card h1 {
            color: #ffffff;
            text-align: center;
            margin-bottom: 10px;
        }

        .register-subtitle {
            color: #b9b3ca;
            text-align: center;
            margin-bottom: 28px;
        }

        .register-card label {
            display: block;
            color: #e8dfff;
            margin: 16px 0 8px;
        }

        .register-card input {
            width: 100%;
            padding: 13px;
            border: 1px solid #494064;
            border-radius: 9px;
            background: #111827;
            color: white;
            outline: none;
        }

        .register-card input:focus {
            border-color: #c084fc;
        }

        .register-button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(90deg, #9333ea, #ec4899);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-button:hover {
            opacity: 0.9;
        }

        .register-footer {
            text-align: center;
            color: #b9b3ca;
            margin-top: 22px;
        }

        .register-footer a {
            color: #e879f9;
            text-decoration: none;
        }

        .register-message {
            color: #fca5a5;
            text-align: center;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>
    <div class="register-page">
        <div class="register-card">

            <h1>ParkEase <span style="color:#e879f9;">2.0</span></h1>

            <p class="register-subtitle">
                Create your account and enjoy smarter parking.
            </p>

            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <p class="register-message">{{ message }}</p>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('register') }}">

                <label for="full_name">Full Name</label>
                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="Enter your full name"
                    required
                    maxlength="100"
                    autocomplete="name"
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    maxlength="254"
                    autocomplete="email"
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password (minimum 8 characters)"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >

                <label for="confirm_password">Confirm Password</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >

                <button type="submit" class="register-button">
                    Create Account
                </button>

            </form>

            <p class="register-footer">
                Already have an account?
                <a href="{{ url_for('login') }}">Login</a>
            </p>

        </div>
    </div>
</body>
</html>
